name: Update screenshots

# Regenerates the Linux visual-regression baselines (screens and per-component stories). Download the artifact,
# copy its two folders into e2e/, and review the images in the diff.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      VISUAL: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook -- --quiet --disable-telemetry
      - run: npx playwright test e2e/visual.spec.ts e2e/stories.visual.spec.ts --update-snapshots=all
      - name: Both baseline folders are filled
        run: test -n "$(ls e2e/visual.spec.ts-snapshots)" && test -n "$(ls e2e/stories.visual.spec.ts-snapshots)"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: |
            e2e/visual.spec.ts-snapshots/
            e2e/stories.visual.spec.ts-snapshots/
          if-no-files-found: error
