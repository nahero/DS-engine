name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR runs get their own group so they never queue ahead of (or replace) a Pages deploy.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (with system dependencies)
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install system dependencies only (browser cached)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Each gate has an id so the job summary can report it. Test gates also write a JUnit report; passing reporters
      # replaces Vitest's defaults, so github-actions (inline failure annotations) is listed explicitly.
      - id: tokens
        name: Token validation, build and contrast
        run: npm run build:tokens
      - id: drift
        name: Generated tokens are up to date
        run: git diff --exit-code src/styles/tokens.css src/styles/tokens.ts
      - id: format
        run: npm run format:check
      - id: lint
        run: npm run lint -- --deny-warnings
      - id: typecheck
        run: npm run typecheck
      - id: token-usage
        run: npm run check:token-usage
      - id: story-coverage
        run: npm run check:stories
      - id: unit
        run: npm run test:unit -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/junit-unit.xml
      - id: test-coverage
        run: npm run check:tests
      - id: components
        run: npm run test:components -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/junit-components.xml
      - id: stories
        run: npm run test:stories -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/junit-stories.xml
      - name: Job summary
        if: always()
        env:
          TITLE: Checks
          GATES: >-
            [["Token validation, build, contrast", "${{ steps.tokens.outcome }}"],
             ["Generated tokens up to date", "${{ steps.drift.outcome }}"],
             ["Format", "${{ steps.format.outcome }}"],
             ["Lint (incl. jsx-a11y)", "${{ steps.lint.outcome }}"],
             ["Typecheck", "${{ steps.typecheck.outcome }}"],
             ["Tokens only", "${{ steps.token-usage.outcome }}"],
             ["Story coverage", "${{ steps.story-coverage.outcome }}"],
             ["Unit tests", "${{ steps.unit.outcome }}", "reports/junit-unit.xml"],
             ["Test coverage", "${{ steps.test-coverage.outcome }}"],
             ["Component tests (light + dark)", "${{ steps.components.outcome }}", "reports/junit-components.xml"],
             ["Story tests with axe (light + dark)", "${{ steps.stories.outcome }}", "reports/junit-stories.xml"]]
        run: node scripts/ci-summary.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (with system dependencies)
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install system dependencies only (browser cached)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Enable visual regression when baselines are committed
        run: |
          if [ -d e2e/visual.spec.ts-snapshots ]; then
            echo "VISUAL=1" >> "$GITHUB_ENV"
          else
            echo "No baselines in e2e/visual.spec.ts-snapshots; visual regression skipped. Run the Update screenshots workflow."
          fi
      - name: Build Storybook (the per-component visual tests read its index)
        run: npm run build-storybook -- --quiet --disable-telemetry
      - id: playwright-tests
        name: End-to-end, accessibility and visual regression
        run: npx playwright test
      - id: bundle
        run: npm run check:bundle
      - id: lighthouse
        run: npm run lighthouse
      - name: Job summary
        if: always()
        env:
          TITLE: End-to-end and performance
          GATES: >-
            [["End-to-end, axe, visual (screens + components)", "${{ steps.playwright-tests.outcome }}", "reports/junit-e2e.xml"],
             ["Bundle budget", "${{ steps.bundle.outcome }}"],
             ["Lighthouse", "${{ steps.lighthouse.outcome }}"]]
        run: node scripts/ci-summary.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      # Always: the HTML report shows every test; on a visual failure it holds expected / actual / diff images.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build-storybook -- -o dist/storybook --disable-telemetry
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
